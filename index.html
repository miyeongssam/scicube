<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사이큐브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 사이큐브 화면 틀 1판 (2026-10-28, T-272) — 색 · 글자 · 부품은 사이큐브_디자인규격_v1.md 그대로 */
:root{--bg:#FFFFFF;--line:#E5E7EB;--line-strong:#C9CDD4;--text:#111111;--sub:#888888;--primary:#2F6BFF;--danger:#E5484D;--ok:#22A06B;--soft:#F5F7FA;--badge-bg:#EEE9FF;--badge-fg:#6B4EFF;--fs:18px}   /* 알렌 실측: 본문 18px */

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:var(--fs);line-height:28px}   /* 알렌 실측: 줄 높이 28px · 자간 보통 */
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1200px;margin:0 auto;height:56px;padding:0 16px;display:flex;align-items:center;gap:16px}
.logo{font-size:20px;font-weight:700;color:var(--primary)}
.crumb{font-size:15px;color:var(--sub)}

/* 본문 + 오른쪽 패널 */
.layout{display:flex;align-items:flex-start}
.main{flex:1;min-width:0;overflow-x:clip}   /* 넓은 그림 · 표가 화면을 옆으로 밀어 왼쪽이 잘리지 않게(원장 11/03) */
html,body{overflow-x:clip}
.panel{overflow-x:hidden}
.wrap{max-width:1060px;margin:0 auto;padding:20px 24px 120px}   /* 화면을 꽉 채우지 않고 가운데(알렌과 비슷한 폭) */
.panel{display:none;position:sticky;top:57px;width:max(380px,40vw);   /* 본문 6 : 패널 4 (원장 10/28) */height:calc(100vh - 57px);overflow:auto;border-left:1px solid var(--line);background:var(--bg);padding:16px 20px 60px}
body.panel-open .panel{display:block}
@media (max-width:899px){
  body.panel-open .panel{position:fixed;inset:auto 0 0 0;top:auto;width:100%;height:70vh;border-left:0;border-top:1px solid var(--line);z-index:30}
}
/* 왼쪽 메뉴(태블릿 · PC 기본 — 결정 D-483 · D-484). 좁은 화면에서는 위쪽 가로 줄 */
.side{position:sticky;top:57px;flex:none;width:180px;height:calc(100vh - 57px);overflow:auto;border-right:1px solid var(--line);background:var(--soft);padding:14px 10px}
.si{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;color:#444;font-size:16px;margin-bottom:2px}
.si:hover{background:#EDF0F5}.si.on{background:#E3EBFF;color:var(--primary);font-weight:600}
.sh{font-size:13px;color:var(--sub);margin:16px 12px 6px}
.sbadge{background:var(--danger);color:#fff;border-radius:10px;font-size:12px;line-height:18px;padding:0 6px;font-weight:600}.sbadge:empty{display:none}
@media (max-width:1299px){ body.panel-open .side{display:none} }
@media (max-width:899px){
  .layout{flex-wrap:wrap}
  .side{position:sticky;top:56px;z-index:15;width:100%;height:auto;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px}
  .si{white-space:nowrap;padding:6px 10px;font-size:15px;margin:0}.sh{display:none}
}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.card{display:block;border:1px solid var(--line);border-radius:12px;padding:14px 16px;line-height:1.6}
.card b{font-size:17px}.card.hl{background:#E3EBFF;border-color:#B9CCFF;color:var(--primary)}.card.hl .sub{color:var(--primary)}
.card .sub a{color:var(--text);text-decoration:underline;text-underline-offset:3px}
.g6{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.ucard{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.4;min-height:96px}
.ucard:hover{border-color:var(--primary)}.ucard b{font-size:18px;color:var(--primary)}.ucard small{margin-top:auto;color:var(--sub);font-size:13px}
.ucard.off{opacity:.55}.ucard.off b{color:var(--sub)}
.muted{color:#AAA}
.menu{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 16px}
.menu a{padding:8px 12px;color:var(--sub);font-size:16px;border-bottom:2px solid transparent;margin-bottom:-1px}
.menu a.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.col3{display:grid;grid-template-columns:210px minmax(0,1fr) 250px;gap:20px;align-items:start}
@media (max-width:899px){ .col3{grid-template-columns:minmax(0,1fr)} }
.c1 .mrow{display:flex;flex-direction:column;padding:10px 12px;border-radius:8px;line-height:1.4;margin-bottom:2px}
.c1 .mrow small{font-size:13px;color:var(--sub)}.c1 .mrow.on{background:#E3EBFF;color:var(--primary);font-weight:600}
.c2 .mid{font-size:14px;color:var(--sub);margin:14px 0 4px;font-weight:600}
.srow2{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;line-height:1.4}
.srow2 input{width:18px;height:18px}.sn2{color:var(--sub);width:20px}.st2{flex:1}.srow2 small{color:var(--sub);font-size:13px;white-space:nowrap}
.c3{background:var(--soft);border-radius:12px;padding:14px 16px;position:sticky;top:80px}
.opt{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;line-height:1.4}.opt small{color:var(--sub);margin-left:auto}
/* 휴대폰(좁은 화면): 맨 위 줄이 꺾이지 않게 — 제목 작게, 넘기기 단추는 다음 줄로 */
@media (max-width:599px){
  .wrap{padding:16px 16px 100px}
  .bar1{flex-wrap:wrap;gap:8px}
  .bar1 h1{font-size:19px;white-space:nowrap}
  .nav span{white-space:nowrap}
  .crumb{display:none}
  .ptabs{gap:12px;font-size:14px;overflow-x:auto;flex:1;min-width:0}
  .ptabs button{white-space:nowrap;flex:none}
  .panel{padding:12px 16px 60px}
}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ph .sp{flex:1}

/* 부품 */
.btn{height:36px;padding:0 16px;border-radius:6px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;white-space:nowrap}
.btn-p{background:var(--primary);color:#fff}
.btn-p:disabled{background:var(--line-strong);cursor:default}
.btn-s{border:1px solid var(--line);background:var(--bg)}
.ic{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:16px}
.badge{display:inline-block;background:var(--soft);border-radius:4px;padding:0 8px;font-size:13px;color:var(--text)}
.badge.v{background:var(--badge-bg);color:var(--badge-fg)}
.sub{color:var(--sub);font-size:14px}
h1{font-size:22px;font-weight:700;margin:0}
h2{font-size:18px;font-weight:700;margin:44px 0 8px}   /* 알렌: 「해설」 「오답 선지」 제목도 본문과 같은 18px 굵게 */

/* 목록 화면 */
.tabs{display:flex;gap:8px;margin:20px 0 12px}
.tab{height:40px;padding:0 16px;border:1px solid var(--line);border-radius:6px;font-size:15px;font-weight:500}
.tab.on{border-color:var(--primary);color:var(--primary)}
.rows{border:1px solid var(--line);border-radius:8px}
.row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.row .no{width:28px;color:var(--sub);font-size:14px}
.row .t{flex:1;font-weight:500;min-width:0}
.row .pv{display:block;font-weight:400;font-size:15px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{width:22px;text-align:center;font-weight:700}
.mark.ok{color:var(--ok)}.mark.bad{color:var(--danger)}
.search{width:100%;height:48px;border:1px solid var(--line);border-radius:24px;padding:0 20px;font:inherit;font-size:15px;margin-bottom:12px}
.group{margin-top:20px}
.group h3{font-size:15px;font-weight:700;color:var(--sub);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);border-radius:6px;padding:4px 12px;font-size:15px}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip .n{color:var(--sub);font-size:13px;margin-left:4px}

/* 문제 화면 */
.bar1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav{display:flex;align-items:center;gap:8px;font-size:15px}
.bar2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 4px;position:sticky;top:57px;z-index:9;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}   /* 아이콘 6개는 아래로 내려도 위에 붙어 있다(원장 11/03 — 읽다가 바로 메모) */
.qno{font-weight:700}
.stem p{margin:6px 0}
.stem .step{padding-left:0}
.fig{text-align:center;margin:16px 0}
.fig img{max-width:100%;max-height:360px}
.bogi{position:relative;border:1px solid var(--text);padding:18px 20px 12px;margin:20px 0 12px;line-height:1.9}
.bogi .bt{position:absolute;top:-0.8em;left:50%;transform:translateX(-50%);background:var(--bg);padding:0 12px;font-size:15px;line-height:1.4}
.choices{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ch{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px 8px 16px;border:1px solid var(--line);border-radius:8px;cursor:pointer;text-align:left;width:100%}
.ch:hover{border-color:var(--line-strong)}
.ch .num{width:26px;height:26px;border:1px solid var(--line-strong);border-radius:50%;font-size:14px;display:grid;place-items:center;flex:none}
.ch .txt{flex:1}
/* ①~⑤만 있는 문제: 선지 앞 ○✕ 칸(보기와 같은 방식 — 처음 ○, 그다음 ○ ↔ ✕). 글자는 지우지 않는다. 고르기는 선지 글자를 누른다 */
/* 합답형: <보기> 줄 아무 데나 누르면 오답 소거(줄 긋기), 선지에는 [오답] 단추 없음 */
.bl{cursor:pointer;border-radius:6px;margin:0 -8px;padding:2px 8px}
.bl:hover{background:var(--soft)}
.bl{display:flex;align-items:flex-start;gap:10px;cursor:pointer;user-select:none}
.bl:hover{background:var(--soft)}
/* 보기 앞 네모 칸 하나: 누를 때마다 ✕(빨강) → ○(파랑) → 빈칸 */
.oxb{flex:none;width:24px;height:24px;margin-top:2px;border:1.5px solid var(--line-strong);border-radius:4px;background:var(--bg);font-size:15px;font-weight:700;line-height:1;display:grid;place-items:center;cursor:pointer}
.oxb:hover{border-color:var(--text)}
.oxb.x{border-color:var(--danger);color:var(--danger)}
.oxb.o{border-color:var(--primary);color:var(--primary)}
body.done .oxb{cursor:default}
.refs{margin:6px 0;padding-left:22px}.refs li{margin:4px 0}
.qa-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:56px}
.post{border-top:1px solid var(--line);padding:12px 0;white-space:pre-wrap;width:100%}
.post:first-child{border-top:0}
.bmk{width:20px;color:var(--primary)}
.ask{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:24px;margin-top:16px}
body.done .bl{cursor:default}
body.done .bl:hover{background:none}
.hapdap .ch .cx{display:none}
.tag{display:inline-block;margin-left:8px;font-size:13px;font-weight:500;padding:0 8px;border-radius:4px;background:#E7F6EF;color:var(--ok)}
/* 메모장 — 알렌 · 슬랙처럼 아이콘 도구줄 */
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;background:var(--soft);padding:4px 6px}
.tbar button{min-width:32px;height:32px;border-radius:6px;font-size:15px;display:inline-grid;place-items:center;position:relative;color:#444}
.tbar button:hover{background:var(--line)}
.tbar select{height:32px;border:0;background:transparent;font:inherit;font-size:14px;padding:0 4px;cursor:pointer}
.tbar .sep{width:1px;height:20px;background:var(--line-strong);margin:0 4px}
.tbar .dd{position:relative;display:inline-flex}
.tbar .caret{min-width:16px;font-size:11px}
.tbar .bar{position:absolute;left:8px;right:8px;bottom:4px;height:3px;border-radius:2px}
.pal{display:none;position:absolute;top:36px;left:0;z-index:5;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;gap:4px}
.pal.on{display:flex}
.pal button span{width:22px;height:22px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:14px}
.memo{min-height:50vh;outline:none;line-height:1.8;padding:12px 14px;border:1px solid var(--line);border-radius:0 0 6px 6px}
.memo:empty:before{content:"이 문제에 대한 메모를 적어 보세요.";color:var(--sub)}
.memo h3{font-size:18px;margin:8px 0}.memo h4{font-size:16px;margin:6px 0}
.memo blockquote{margin:6px 0;padding-left:12px;border-left:3px solid var(--line-strong);color:#444}
.memo mark{background:#FFF3A3}
.mhelp{color:var(--sub);font-size:13px;margin-top:8px;line-height:1.8}
.mhelp code{background:var(--soft);border-radius:4px;padding:0 4px;font-size:12px;color:var(--text)}
.mfoot{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-top:8px}
.tools{display:flex;gap:6px}
.ic svg{display:block}
.ic.on{border-color:var(--primary);color:var(--primary)}
.ic.act{border-color:var(--primary);color:var(--primary);background:rgba(47,107,255,.1)}   /* 오른쪽 창이 열려 있는 아이콘 */
/* 답안지 */
.sheet{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.srow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px}
.srow:hover,.srow.cur{background:var(--soft)}
.srow .sn{width:24px;font-weight:700;font-size:14px}
.srow .dot{width:24px;height:24px;border:1px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--sub)}
.dot{width:24px;height:24px;border:1px solid var(--line-strong);border-radius:50%;display:inline-grid;place-items:center;font-size:12px;color:var(--sub)}
.dot.mine{background:#444;border-color:#444;color:#fff}
.dot.ok{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.dot.ans{border:2px solid var(--primary);color:var(--primary);font-weight:700}
.dot.bad{background:var(--danger);border-color:var(--danger);color:#fff}
.sr{width:18px;font-weight:700;text-align:center}.sr.o{color:var(--primary)}.sr.x{color:var(--danger)}
.omrpage .sheet{display:block;columns:3 280px;column-gap:24px;margin:16px 0}   /* 1 · 2 · 3 … 위에서 아래로 */
.omrpage .srow{break-inside:avoid}
.omrpage .srow{padding:8px}
/* 해설 묶음 — 바로 가기 단추 · 큰 제목(색 띠) · 더 알아보기 접기 (원장 11/03 3차 검토) */
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:24px 0 4px}
.jump a{padding:6px 14px;border:1px solid var(--line-strong);border-radius:999px;font-size:14px;font-weight:600;background:var(--bg)}
.jump a:hover{border-color:var(--primary);color:var(--primary)}
.sech{font-size:19px;font-weight:700;margin:36px 0 10px;padding:8px 12px;border-left:4px solid var(--primary);background:var(--soft);border-radius:0 6px 6px 0;scroll-margin-top:130px}
.sech.bg{border-left-color:var(--ok)}   /* .bogi(＜보기＞ 상자)와 이름이 겹쳐 굵은 테두리가 생겼던 것을 고침 */
.sech.mo{border-left-color:var(--line-strong)}
details.morebox{scroll-margin-top:130px}
details.morebox > summary{list-style:none;cursor:pointer;outline:none}
details.morebox > summary::-webkit-details-marker{display:none}
details.morebox .tog{margin-left:10px;font-size:14px;font-weight:600;color:var(--primary)}
details.morebox .tog::after{content:'▾ 펼치기'}
details.morebox[open] .tog::after{content:'▴ 접기'}
details.morebox .x .h3{font-size:18px;color:var(--text);padding-left:10px;border-left:3px solid var(--line-strong)}   /* 더 알아보기 안 소제목 — 아이패드에서도 눈에 띄게 */
.excrumb{font-size:15px;color:var(--sub);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.excrumb a{color:var(--sub)}.excrumb a:hover{color:var(--primary)}
.excrumb b{color:var(--text);font-size:17px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;font-size:13px;color:var(--sub)}
.legend > span{display:inline-flex;align-items:center;gap:6px}
.srow .sq{width:16px;color:var(--primary);font-weight:700}
.ptabs{display:flex;gap:16px;font-size:15px}
.ptabs button{color:var(--sub);padding:4px 0}
.ptabs button.on{color:var(--text);font-weight:700}
.ch.sel{border-color:var(--primary)}
.ch.sel .num{background:var(--primary);border-color:var(--primary);color:#fff}
body.done .ch{cursor:default}
body.done .ch.correct{border-color:var(--primary);color:var(--primary)}
body.done .ch.correct .num{background:var(--primary);border-color:var(--primary);color:#fff}
body.done .ch.mywrong{border-color:var(--danger);color:var(--danger)}
body.done .ch.mywrong .num{background:var(--danger);border-color:var(--danger);color:#fff}
.check{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.result{font-size:17px;font-weight:700;margin-top:16px}
.result.ok{color:var(--primary)}.result.bad{color:var(--danger)}
/* 통계 줄(알렌처럼) — 정답률 · 누적 · 평균은 서버가 생기면 채운다 */
.stat{margin-top:12px;background:var(--soft);border-left:3px solid var(--primary);padding:14px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;font-size:16px}
.after{display:none}
body.done .after{display:block}
/* 해설 · 개념: 한 줄씩 띄워 읽기 편하게(알렌 시험 복습 화면처럼 — 스크롤로 내려 읽으므로 촘촘히 붙이지 않는다) */
.x{line-height:28px}
.x ul{margin:8px 0;padding-left:22px}
.x ul.sub{margin:6px 0 4px;padding-left:20px;font-size:inherit;color:inherit}
.x li{margin:5px 0 33px}   /* 알렌: 해설 점마다 한 줄(28px) 띄움 */
.x ul.sub li{margin:5px 0}
.x li:has(> ul.sub){margin-bottom:33px}
.x li > ul.sub > li:last-child{margin-bottom:0}
.x .h3{font-weight:700;margin:40px 0 8px}   /* 소제목이 바뀔 때는 한 줄쯤 더 띄운다 */
.x .h3:first-child{margin-top:8px}
.x p{margin:6px 0}
.x table{border-collapse:collapse;margin:12px 0;width:100%}
.x th,.x td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.x th{background:var(--soft)}
.more{border-top:1px dashed var(--line-strong);margin-top:24px}
.answer{font-size:18px;font-weight:700;color:var(--primary)}
.lk{color:var(--primary);border-bottom:1px dashed var(--primary)}
.lk:hover{border-bottom-style:solid}
